<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Shooter 3D - Ing. Cristian Arcos</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Encabezado Estilo Misión Táctica / Cyber HUD -->
  <header class="cyber-header">
    <div class="header-badge">⚡ TACTICAL PROTOCOL V2.0</div>
    <h1>CYBER SHOOTER 3D</h1>
    <p class="subtitle">ARENA INTERACTIVA &bull; CRISTIAN ARCOS</p>
  </header>

  <!-- Panel de Estadísticas / HUD Izquierdo -->
  <div class="hud">
    <div class="hud-card">
      <span class="hud-icon">🏆</span> Puntos: <span class="value" id="score">0</span>
    </div>
    <div class="hud-card">
      <span class="hud-icon">🔫</span> Disparos: <span class="value" id="shots">0</span>
    </div>
    <div class="hud-card">
      <span class="hud-icon">🎯</span> Aciertos: <span class="value" id="hits">0</span>
    </div>
  </div>

  <!-- Barra de Salud / Escudo Energético (Inferior) -->
  <div class="health-container">
    <div class="health-info">
      <span>🛡️ INTEGRIDAD DEL OBJETIVO</span>
      <span id="health-text">100 / 100</span>
    </div>
    <div class="health-bar-bg">
      <div class="health-bar-fill" id="health-bar"></div>
    </div>
  </div> 

  <!-- Contenedor del Modelo 3D -->
  <div class="viewer-box" id="viewerBox">
    <model-viewer id="3dModel" src="Nueva carpeta/football_ball.glb" auto-rotate camera-controls></model-viewer>
    <div class="target-overlay" id="targetOverlay" title="¡Haz clic aquí para disparar al objeto 3D!"></div>
  </div>

  <!-- Botones y Selector de Objetos 3D (Derecha) -->
  <div class="controls">
    <label for="modelSelect">⚙️ SELECTOR 3D:</label>
    <select id="modelSelect">
      <option value="Nueva carpeta/football_ball.glb">⚽ Balón Cibernético</option>
      <option value="Nueva carpeta/pelota_peluda_con_ojos.glb">🛸 Balon con Ojos</option>
    </select>
    <button id="resetBtn">🔄 REINICIAR MISIÓN</button>
  </div>

  <!-- Pantalla de Victoria Estilizada (Modal) -->
  <div class="victory-modal" id="victoryModal">
    <div class="victory-content">
      <h2>🏆 ¡OBJETIVO NEUTRALIZADO!</h2>
      <p>Has completado la misión con éxito.</p>
      <div class="victory-bonus">+500 PUNTOS DE BONIFICACIÓN</div>
      <button onclick="closeVictoryModal()">CONTINUAR CAZA</button>
    </div>
  </div>

  <!-- Elementos de Audio -->
  <audio id="shootSound" src="Nueva carpeta/Sonido_disparo.mp3" preload="auto"></audio>

  <!-- Enlaces a JS y Model-Viewer -->
  <script src="script.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</body>
</html>

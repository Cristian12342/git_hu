<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de Disparo 3D -Cristian Arcos</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <h1>Juego de Disparo al Objeto 3D</h1>
    <p class="subtitle">Ejemplo didáctico de clase con HTML, CSS y Google &lt;model-viewer&gt; -Cristian Arcos</p>
  </header>

  <!-- Panel de Estadísticas / HUD -->
  <div class="hud">
    <div class="hud-card">Puntos: <span class="value" id="score">0</span></div>
    <div class="hud-card">Disparos: <span class="value" id="shots">0</span></div>
    <div class="hud-card">Aciertos: <span class="value" id="hits">0</span></div>
  </div>

  <!-- Barra de Salud del Objeto -->
  <div class="health-container">
    <div style="display:flex; justify-content:space-between; margin-bottom: 4px; font-size: 0.85rem;">
      <span>Salud del Objetivo</span>
      <span id="health-text">100 / 100</span>
    </div>
    <div class="health-bar-bg">
      <div class="health-bar-fill" id="health-bar"></div>
    </div>
  </div> 

  <!-- Contenedor del Modelo 3D con movimiento dinámico -->
  <div class="viewer-box" id="viewerBox">
    <model-viewer id="3dModel" src="Nueva carpeta/football_ball.glb" auto-rotate camera-controls></model-viewer>
    <div class="target-overlay" id="targetOverlay" title="¡Haz clic aquí para disparar al objeto 3D!"></div>
  </div>

  <!-- Botones y Selector de Objetos 3D -->
  <div class="controls">
    <label for="modelSelect">Objeto 3D:</label>
    <select id="modelSelect">
      <option value="Nueva carpeta/football_ball.glb">⚽ Balón de Fútbol</option>
      <option value="Nueva carpeta/pelota_peluda_con_ojos.glb">🛸 Pelota con ojos 3D</option>
      
    </select>
    <button id="resetBtn">🔄 Reiniciar Juego</button>
  </div>

  <!-- Elementos de Audio para el Juego -->

  <audio id="shootSound" src="Nueva carpeta/Sonido_disparo.mp3 preload="auto"></audio>
  <audio id="hitSound" src="Nueva carpeta/explosion.mp3" preload="auto"></audio>

  <!-- Enlaces a JS y Model-Viewer -->
  <script src="script.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</body>
</html>
